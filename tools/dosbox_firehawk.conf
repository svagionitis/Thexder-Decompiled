[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=1280x800
output=overlay
autolock=true

[dosbox]
machine=svga_s3
captures=captures

[render]
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=4000
cycleup=500
cycledown=500

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[autoexec]
@echo off
mount c assets/firehawk
c:
GAME.EXE

